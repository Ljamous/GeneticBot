

services:
  # Database Service
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-db_password}
      MYSQL_DATABASE: ${DB_NAME:-app_db}
      MYSQL_USER: ${DB_USER:-db_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-db_password}
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Mount the SQL dump if it exists to auto-init the DB
      - ./src/system/database/app_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Main PHP Application
  system:
    build:
      context: ./src/system
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SYSTEM_PORT:-80}:80"
    environment:
      DB_HOST: ${DOCKER_DB_HOST:-db}
      DB_USER: ${DB_USER:-db_user}
      DB_PASSWORD: ${DB_PASSWORD:-db_password}
      DB_NAME: ${DB_NAME:-app_db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Medical Analysis Service (FastAPI)
  medical-analysis:
    build:
      context: ./src/Medical-Analysis-main
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${MEDICAL_ANALYSIS_PORT:-8000}:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DB_HOST: ${DOCKER_DB_HOST:-db}
      DB_USER: ${DB_USER:-db_user}
      DB_PASSWORD: ${DB_PASSWORD:-db_password}
      DB_NAME: ${DB_NAME:-app_db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Pedigree Service
  pedigree:
    build:
      context: ./src/pedigree
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PEDIGREE_PORT:-8001}:8001"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # GeneticBot Service
  genetic-bot:
    build:
      context: ./src/genetic_bot
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${GENETIC_BOT_PORT:-8501}:8501"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Ensure Streamlit knows it's behind a proxy/docker if needed
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
